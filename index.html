
<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f0" />

    <!-- Page Title -->
    <title>Dina Prastuti | Personal Portfolio</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="A personal portfolio showcasing my education, experience, projects, skills, achievements, certifications, and journey as an aspiring data professional."
    />

    <!-- Open Graph / Link Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dina Prastuti | Personal Portfolio" />
    <meta
      property="og:description"
      content="A personal portfolio showcasing my education, experience, projects, skills, achievements, certifications, and journey as an aspiring data professional."
    />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dina Prastuti | Personal Portfolio" />
    <meta
      name="twitter:description"
      content="A personal portfolio showcasing my education, experience, projects, skills, achievements, certifications, and journey as an aspiring data professional."
    />

    <script>
      // Apply the theme before the first paint, including when storage is blocked.
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("portfolio-theme");
        } catch {}
        document.documentElement.dataset.theme =
          theme === "dark" || theme === "light"
            ? theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
